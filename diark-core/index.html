<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIARK // OS</title>
    <script>
      window.addEventListener("error", function (event) {
        console.error("[DIARK Fatal Script Error]:", event.error || event.message);
        var errDiv = document.getElementById("fatal-error-overlay");
        if (!errDiv) {
          errDiv = document.createElement("div");
          errDiv.id = "fatal-error-overlay";
          errDiv.style.cssText = "position:fixed;inset:0;background:#09090b;color:#f87171;padding:32px;font-family:monospace;z-index:999999;display:flex;flex-direction:column;gap:16px;overflow:auto;";
          if (document.body) {
            document.body.appendChild(errDiv);
          } else {
            window.addEventListener("DOMContentLoaded", function () {
              document.body.appendChild(errDiv);
            });
          }
        }
        errDiv.innerHTML = '<h2 style="color:#ef4444;font-size:16px;margin:0;">[DIARK Fatal Error]</h2><pre style="background:#18181b;padding:16px;border-radius:8px;border:1px solid #3f3f46;color:#f4f4f5;font-size:12px;white-space:pre-wrap;">' + (event.error ? (event.error.stack || event.error.message) : event.message) + '</pre><p style="color:#a1a1aa;font-size:12px;">Xảy ra tại: ' + (event.filename || '') + ':' + (event.lineno || '') + '</p>';
      });
    </script>
    <style>
      html, body, #root {
        background-color: #09090b;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      /* Custom sleek dark scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }
      @keyframes diark-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes diark-spin-reverse {
        to { transform: rotate(-360deg); }
      }
      @keyframes diark-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
  </head>

  <body class="bg-zinc-950 text-zinc-100">
    <div id="root">
      <div style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; flex-direction: column; gap: 16px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background-color: #09090b; user-select: none;">
        <div style="position: relative; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; width: 44px; height: 44px; border: 2px solid #27272a; border-top-color: #10b981; border-radius: 50%; animation: diark-spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;"></div>
          <div style="position: absolute; width: 24px; height: 24px; border: 2px solid #27272a; border-bottom-color: #06b6d4; border-radius: 50%; animation: diark-spin-reverse 1.3s linear infinite;"></div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <div style="font-weight: 700; font-size: 13px; letter-spacing: 0.15em; color: #f4f4f5;">DIARK <span style="color: #06b6d4;">// OS</span></div>
          <div style="font-size: 11px; letter-spacing: 0.08em; color: #71717a; animation: diark-pulse 1.8s ease-in-out infinite;">Đang tải hệ thống...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
