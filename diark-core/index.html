<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diark</title>
    <script src="/fatal-error.js"></script>
    <style>
      html, body, #root {
        background-color: #080808;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: #080808;
      }
      ::-webkit-scrollbar-thumb {
        background: #242428;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a3a40;
      }
      @keyframes diark-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body class="bg-[#080808] text-zinc-100">
    <div id="root">
      <div style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font-family: ui-sans-serif, system-ui, sans-serif; background-color: #080808; user-select: none;">
        <div style="width: 34px; height: 34px; border: 2px solid #222225; border-top-color: #f4f4f5; border-radius: 50%; animation: diark-spin 0.85s linear infinite;"></div>
        <div style="font-weight: 600; font-size: 13px; letter-spacing: 0.06em; color: #e4e4e7;">Diark</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
