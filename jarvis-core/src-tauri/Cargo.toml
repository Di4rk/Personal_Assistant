[package]
name = "jarvis-core"
version = "0.1.0"
description = "JARVIS Personal OS - Core Vertical Slice"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri core ---
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Database ---
# "bundled" tự build SQLite từ source, khỏi phải cài SQLite riêng trên máy (quan trọng cho Windows)
rusqlite = { version = "0.31", features = ["bundled"] }

# --- Local HTTP server (nhận webhook từ Chrome extension) ---
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower-http = { version = "0.5", features = ["cors"] }

# --- Utils ---
chrono = { version = "0.4", features = ["serde"] }

# --- Chỉ dùng cho mock data seeder (dev-only, xem cfg(debug_assertions)) ---
rand = "0.8"

[profile.release]
# Tối ưu size + tốc độ cho bản release, quan trọng vì mày cần app nhẹ
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
